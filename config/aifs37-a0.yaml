# AIFS 37-level recipe, round 1, run A0: Bo's 14 levels, 10 hPa top. Compose after aifs37, e.g.
#   make config compose=base:aifs2-1deg:aifs37:aifs37-a0:ursa:anemoi-dev[:mi300x]
# Written by config/aifs37-gen/gen_aifs37.py (lists are long); all three runs take their pressure levels from the 37-level
# zarr, so they differ only in the levels.

# yamllint disable rule:line-length

app:
  experiment_name: aifs37-a0
training:
  anemoi:
    data:
      datasets:
        data:
          diagnostic: [tp, cp, q_10, q_50, w_10, w_50, w_100, w_150, w_200, w_250, w_300, w_400, w_500, w_600, w_700, w_850, w_925, w_1000]
          processors:
            normalizer:
              config:
                std: [tp, cp, tcw, sd, swvl1, q_10, q_50, q_100, q_150, q_200, q_250, q_300, q_400, q_500, q_600, q_700, q_850, q_925, q_1000]
    model:
      bounding:
        datasets:
          data:
            - _target_: anemoi.models.layers.bounding.ReluBounding
              variables: [tp, tcw, sd, swvl1, q_10, q_50, q_100, q_150, q_200, q_250, q_300, q_400, q_500, q_600, q_700, q_850, q_925, q_1000]
            - _target_: anemoi.models.layers.bounding.HardtanhBounding
              variables: [siconc]
              min_val: 0
              max_val: 1
            - _target_: anemoi.models.layers.bounding.FractionBounding
              variables: [cp]
              min_val: 0
              max_val: 1
              total_var: tp
            - _target_: anemoi.models.layers.bounding.GlobalDryMassFixer
              variables: [sp]
              water_var: tcw
val:
  era5:
    dataset:
      join:
        - dataset: '{{ val.era5.dir }}/era5-o96-1979-2023-6h-v8.zarr'
          select: [10u, 10v, 2d, 2t, cos_julian_day, cos_latitude, cos_local_time, cos_longitude, cp, insolation, lsm, msl, sdor, sin_julian_day, sin_latitude, sin_local_time, sin_longitude, skt, slor, sp, tcw, tp, z]
          start: '{{ val.era5.start }}' # join needs equal dates: v8 cut to the new zarrs' range
          end: '{{ val.era5.end }}'
        - dataset: '{{ val.era5.dir37 }}/{{ val.era5.zarr37 }}'
          select: [q_10, q_50, q_100, q_150, q_200, q_250, q_300, q_400, q_500, q_600, q_700, q_850, q_925, q_1000, t_10, t_50, t_100, t_150, t_200, t_250, t_300, t_400, t_500, t_600, t_700, t_850, t_925, t_1000, u_10, u_50, u_100, u_150, u_200, u_250, u_300, u_400, u_500, u_600, u_700, u_850, u_925, u_1000, v_10, v_50, v_100, v_150, v_200, v_250, v_300, v_400, v_500, v_600, v_700, v_850, v_925, v_1000, w_10, w_50, w_100, w_150, w_200, w_250, w_300, w_400, w_500, w_600, w_700, w_850, w_925, w_1000, z_10, z_50, z_100, z_150, z_200, z_250, z_300, z_400, z_500, z_600, z_700, z_850, z_925, z_1000, sd, siconc, swvl1, cvh, cvl, lai_hv, lai_lv, slt, fsr]
        - '{{ val.era5.dir37 }}/{{ val.era5.zarrstl1 }}'
      drop: [] # aifs2-1deg drops q_10 (Bo's set); here q_10 is a diagnostic of every run
