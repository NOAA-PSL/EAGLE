# AIFS 37-level recipe, round 1, run A1: all 37 ERA5 levels, 1 hPa top. Compose after aifs37, e.g.
#   make config compose=base:aifs2-1deg:aifs37:aifs37-a1:ursa:anemoi-dev[:mi300x]
# Written by config/aifs37-gen/gen_aifs37.py (lists are long); all three runs take their pressure levels from the 37-level
# zarr, so they differ only in the levels.

# yamllint disable rule:line-length

app:
  experiment_name: aifs37-a1
training:
  anemoi:
    data:
      datasets:
        data:
          diagnostic: [tp, cp, q_1, q_2, q_3, q_5, q_7, q_10, q_20, q_30, q_50, w_1, w_2, w_3, w_5, w_7, w_10, w_20, w_30, w_50, w_70, w_100, w_125, w_150, w_175, w_200, w_225, w_250, w_300, w_350, w_400, w_450, w_500, w_550, w_600, w_650, w_700, w_750, w_775, w_800, w_825, w_850, w_875, w_900, w_925, w_950, w_975, w_1000]
          processors:
            normalizer:
              config:
                std: [tp, cp, tcw, sd, swvl1, q_1, q_2, q_3, q_5, q_7, q_10, q_20, q_30, q_50, q_70, q_100, q_125, q_150, q_175, q_200, q_225, q_250, q_300, q_350, q_400, q_450, q_500, q_550, q_600, q_650, q_700, q_750, q_775, q_800, q_825, q_850, q_875, q_900, q_925, q_950, q_975, q_1000]
    model:
      bounding:
        datasets:
          data:
            - _target_: anemoi.models.layers.bounding.ReluBounding
              variables: [tp, tcw, sd, swvl1, q_1, q_2, q_3, q_5, q_7, q_10, q_20, q_30, q_50, q_70, q_100, q_125, q_150, q_175, q_200, q_225, q_250, q_300, q_350, q_400, q_450, q_500, q_550, q_600, q_650, q_700, q_750, q_775, q_800, q_825, q_850, q_875, q_900, q_925, q_950, q_975, q_1000]
            - _target_: anemoi.models.layers.bounding.HardtanhBounding
              variables: [siconc]
              min_val: 0
              max_val: 1
            - _target_: anemoi.models.layers.bounding.FractionBounding
              variables: [cp]
              min_val: 0
              max_val: 1
              total_var: tp
            - _target_: anemoi.models.layers.bounding.GlobalDryMassFixer
              variables: [sp]
              water_var: tcw
val:
  era5:
    dataset:
      join:
        - dataset: '{{ val.era5.dir }}/era5-o96-1979-2023-6h-v8.zarr'
          select: [10u, 10v, 2d, 2t, cos_julian_day, cos_latitude, cos_local_time, cos_longitude, cp, insolation, lsm, msl, sdor, sin_julian_day, sin_latitude, sin_local_time, sin_longitude, skt, slor, sp, tcw, tp, z]
          start: '{{ val.era5.start }}' # join needs equal dates: v8 cut to the new zarrs' range
          end: '{{ val.era5.end }}'
        - dataset: '{{ val.era5.dir37 }}/{{ val.era5.zarr37 }}'
          select: [q_1, q_2, q_3, q_5, q_7, q_10, q_20, q_30, q_50, q_70, q_100, q_125, q_150, q_175, q_200, q_225, q_250, q_300, q_350, q_400, q_450, q_500, q_550, q_600, q_650, q_700, q_750, q_775, q_800, q_825, q_850, q_875, q_900, q_925, q_950, q_975, q_1000, t_1, t_2, t_3, t_5, t_7, t_10, t_20, t_30, t_50, t_70, t_100, t_125, t_150, t_175, t_200, t_225, t_250, t_300, t_350, t_400, t_450, t_500, t_550, t_600, t_650, t_700, t_750, t_775, t_800, t_825, t_850, t_875, t_900, t_925, t_950, t_975, t_1000, u_1, u_2, u_3, u_5, u_7, u_10, u_20, u_30, u_50, u_70, u_100, u_125, u_150, u_175, u_200, u_225, u_250, u_300, u_350, u_400, u_450, u_500, u_550, u_600, u_650, u_700, u_750, u_775, u_800, u_825, u_850, u_875, u_900, u_925, u_950, u_975, u_1000, v_1, v_2, v_3, v_5, v_7, v_10, v_20, v_30, v_50, v_70, v_100, v_125, v_150, v_175, v_200, v_225, v_250, v_300, v_350, v_400, v_450, v_500, v_550, v_600, v_650, v_700, v_750, v_775, v_800, v_825, v_850, v_875, v_900, v_925, v_950, v_975, v_1000, w_1, w_2, w_3, w_5, w_7, w_10, w_20, w_30, w_50, w_70, w_100, w_125, w_150, w_175, w_200, w_225, w_250, w_300, w_350, w_400, w_450, w_500, w_550, w_600, w_650, w_700, w_750, w_775, w_800, w_825, w_850, w_875, w_900, w_925, w_950, w_975, w_1000, z_1, z_2, z_3, z_5, z_7, z_10, z_20, z_30, z_50, z_70, z_100, z_125, z_150, z_175, z_200, z_225, z_250, z_300, z_350, z_400, z_450, z_500, z_550, z_600, z_650, z_700, z_750, z_775, z_800, z_825, z_850, z_875, z_900, z_925, z_950, z_975, z_1000, sd, siconc, swvl1, cvh, cvl, lai_hv, lai_lv, slt, fsr]
        - '{{ val.era5.dir37 }}/{{ val.era5.zarrstl1 }}'
      drop: [] # aifs2-1deg drops q_10 (Bo's set); here q_10 is a diagnostic of every run
